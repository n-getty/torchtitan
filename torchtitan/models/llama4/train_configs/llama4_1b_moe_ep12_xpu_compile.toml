# Llama4 1B MoE (EP=12) XPU Compiled Configuration
# For fair comparison with dense model (same settings)

[job]
dump_folder = "./outputs_llama4_1b_moe_ep12_compile"
description = "Llama 4 1B MoE (EP=12) benchmark on XPU (Compiled)"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1
enable_tensorboard = false

[model]
name = "llama4"
flavor = "1B_12_rank"
hf_assets_path = "/lus/flare/projects/AuroraGPT/ngetty/torchtitan_xpu/torchtitan/tests/assets/tokenizer"
use_triton_moe = false

[optimizer]
name = "AdamW"
lr = 3e-4

[training]
local_batch_size = 4
seq_len = 2048
max_norm = 1.0
steps = 10
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"

dataset = "c4_test"
dataset_path = "/lus/flare/projects/AuroraGPT/ngetty/torchtitan_xpu/torchtitan/tests/assets/c4_test"

[lr_scheduler]
warmup_steps = 2

# NOTE: AC is disabled for EP because the all_to_all autograd wrapper
# accumulates saved tensors during AC recomputation, causing memory leaks.
# Use mode = "none" for EP configurations until this is fixed upstream.
[activation_checkpoint]
mode = "none"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = 12
tensor_parallel_degree = 1
# EP=12, so each rank holds 1 expert
expert_parallel_degree = 12
pipeline_parallel_degree = 1

expert_parallel_comm_backend = "standard"

[compile]
enable = true
